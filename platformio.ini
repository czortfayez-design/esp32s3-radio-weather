[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    WiFi
    AsyncTCP
    ESPAsyncWebServer
    ArduinoJson
    lvgl/lvgl @ ^8.3.0
    DFRobot_ST7701S
    ESP32-audioI2S
    HTTPClient
    time

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLVGL_CONF_INCLUDE_SIMPLE
    
[platformio]
default_envs = esp32s3
